name: tests

# The test suite on every pull request and every branch push, so a failing test blocks a merge
# rather than a release. It holds no secrets and asks for nothing but read access: in a public
# repository a pull request from a fork runs this, and it must not be able to reach the signing key
# or the index token. Releasing is release.yml's alone.
on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Node is on the runner already, and test_page_scripts.py uses it to syntax check the pages'
      # scripts.
      - name: Run the plugin's tests
        run: sh plugin/tests/run.sh
