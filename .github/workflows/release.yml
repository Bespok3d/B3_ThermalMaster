name: build-and-release

# Build, bake, pack and release the plugin through the shared Bespok3d build Action, then register
# the atom in the org's index if this repo has been given a token for it.
on:
  push:
    tags:
      # A release is published by a version tag and by nothing else. A branch trigger would hand
      # every enrolled printer a package built from whatever that branch happened to hold, work in
      # progress included, and the shared release-trigger detector fails the gate if one is added.
      # scripts/tag_version_guard.sh refuses a tag whose version the manifest does not declare.
      - 'plugin-*-v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create releases on this repo
    env:
      MAIN_INDEX_TOKEN: ${{ secrets.MAIN_INDEX_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # The Run workflow button stays usable: this step, not a job level `if`, is what decides. A
      # manual run against a release tag republishes it; a manual run against a branch is refused
      # here, loudly, instead of skipping the job and reporting success.
      - name: Refuse a ref that is not a plugin release tag
        run: sh scripts/tag_version_guard.sh "${{ github.ref_name }}"

      - uses: Bespok3d/b3-builder@f09f2529dafd7edf78a5256f0f66aa1d5324d4ea  # main @ 2026-08-30
        with:
          unit: repo
          signing-key: ${{ secrets.REGISTRY_SIGNING_KEY }}
          # This plugin declares Python dependencies, so the bake is what fills files/wheels. Without
          # it the builder refuses to pack rather than shipping a plugin that cannot start.
          bake: 'true'
          atom-repo: ${{ github.repository }}

      # This repo lives outside the Bespok3d org, so it may have no token for the org's index. The
      # guard is on an env var rather than on secrets directly, because the secrets context is not
      # available to a step condition. Without the token the release is still cut; only the index
      # registration is skipped.
      - name: Register the atom in the main index
        if: env.MAIN_INDEX_TOKEN != ''
        uses: Bespok3d/main-index/.github/actions/register-atoms@3d4fa2adb4f39aa22b7112ff26fd9522db7b4827  # main @ 2026-07-26
        with:
          token: ${{ secrets.MAIN_INDEX_TOKEN }}
