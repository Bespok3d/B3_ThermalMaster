# Bespok3d thermal-master: reverse proxy for the thermal streamer on 127.0.0.1:8082.
#
# No auth_request in front of the stream, deliberately. The Fluidd and Mainsail camera tile is a
# plain <img>, which cannot send an Authorization header, and every other camera on this printer is
# reachable the same way. Guarding this one alone would break the tile without making the printer
# meaningfully harder to reach.

location = /thermal { return 301 /thermal/; }

location /thermal/ {
    proxy_pass http://127.0.0.1:8082/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# proxy_buffering off is what makes MJPEG work: with buffering on, nginx accumulates the multipart
# response and the tile shows nothing until it gives up. The long read timeout keeps a stream that is
# idle between frames from being cut.
location = /thermal/stream.mjpg {
    proxy_pass http://127.0.0.1:8082/stream.mjpg;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

location = /thermal/snapshot.jpg {
    proxy_pass http://127.0.0.1:8082/snapshot.jpg;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}

# The interactive viewer and the frame of temperatures it reads. Both go through the generic
# /thermal/ proxy above, which is enough for them: neither is a long-lived stream, so neither needs
# the buffering and timeout treatment the MJPEG endpoint gets. They are named here only so the
# no-store header is set, because a cached frame of temperatures is a wrong frame of temperatures.
location = /thermal/frame.bin {
    proxy_pass http://127.0.0.1:8082/frame.bin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}
